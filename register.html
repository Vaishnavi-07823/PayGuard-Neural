<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PayGuard Neural — Secure Registration</title>
  <meta name="description" content="Register for PayGuard Neural — AI-powered payment security for the modern world." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Registration-specific styles */
    .registration-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 500px;
      padding: 20px;
      animation: cardEnter 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(30px) scale(0.97);
    }
 
    .registration-form {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 40px;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .form-section {
      margin-bottom: 24px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px 16px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124, 92, 252, 0.1);
    }

    .form-group input::placeholder {
      color: var(--text-muted);
    }

    .password-requirements {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 8px;
      padding: 12px;
      background: rgba(0, 0, 0, 0.2);
      border-left: 3px solid var(--accent);
      border-radius: 4px;
    }

    .requirement {
      margin: 4px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .requirement.met {
      color: var(--success);
    }

    .requirement-check {
      width: 16px;
      height: 16px;
      border: 1px solid currentColor;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    }

    .requirement.met .requirement-check::after {
      content: "✓";
    }

    .terms-agreement {
      font-size: 12px;
      color: var(--text-secondary);
      margin: 20px 0;
    }

    .terms-agreement input {
      margin-right: 8px;
    }

    .btn-register {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-glow) 100%);
      border: none;
      border-radius: var(--radius-md);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-register:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(124, 92, 252, 0.4);
    }

    .btn-register:active {
      transform: translateY(0);
    }

    .btn-register.loading {
      opacity: 0.7;
      pointer-events: none;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .login-link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .login-link a:hover {
      color: var(--accent-glow);
    }

    .error-message {
      background: rgba(255, 92, 124, 0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 12px;
      border-radius: var(--radius-sm);
      margin-bottom: 16px;
      font-size: 13px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .success-message {
      background: rgba(0, 232, 157, 0.1);
      border: 1px solid var(--success);
      color: var(--success);
      padding: 12px;
      border-radius: var(--radius-sm);
      margin-bottom: 16px;
      font-size: 13px;
      display: none;
    }

    .success-message.show {
      display: block;
    }

    @media (max-width: 640px) {
      .form-row {
        grid-template-columns: 1fr;
      }

      .registration-form {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <!-- Neural Particle Canvas -->
  <canvas id="neuralCanvas"></canvas>

  <!-- Ambient Glow Orbs -->
  <div class="orb orb--1"></div>
  <div class="orb orb--2"></div>
  <div class="orb orb--3"></div>

  <!-- Registration Container -->
  <div class="registration-wrapper">
    <div class="registration-form">
      <h1 style="text-align: center; margin-bottom: 10px; font-size: 28px; background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">
        Create Your Account
      </h1>
      <p style="text-align: center; color: var(--text-secondary); margin-bottom: 30px; font-size: 14px;">
        Join PayGuard Neural for AI-powered payment security
      </p>

      <div class="error-message" id="errorMessage"></div>
      <div class="success-message" id="successMessage"></div>

      <form id="registrationForm">
        <!-- Full Name -->
        <div class="form-row">
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input
              type="text"
              id="firstName"
              name="firstName"
              placeholder="John"
              required
            />
          </div>
          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input
              type="text"
              id="lastName"
              name="lastName"
              placeholder="Doe"
              required
            />
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
          />
        </div>

        <!-- Phone -->
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="+1 (555) 123-4567"
          />
        </div>

        <!-- Company (Optional) -->
        <div class="form-group">
          <label for="company">Company (Optional)</label>
          <input
            type="text"
            id="company"
            name="company"
            placeholder="Your Company"
          />
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter a strong password"
            required
          />
          <div class="password-requirements">
            <div class="requirement" id="req-length">
              <span class="requirement-check"></span>
              At least 8 characters
            </div>
            <div class="requirement" id="req-uppercase">
              <span class="requirement-check"></span>
              One uppercase letter
            </div>
            <div class="requirement" id="req-lowercase">
              <span class="requirement-check"></span>
              One lowercase letter
            </div>
            <div class="requirement" id="req-number">
              <span class="requirement-check"></span>
              One number
            </div>
            <div class="requirement" id="req-special">
              <span class="requirement-check"></span>
              One special character (!@#$%^&*)
            </div>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Re-enter your password"
            required
          />
        </div>

        <!-- Terms Agreement -->
        <div class="terms-agreement">
          <input
            type="checkbox"
            id="agreeTerms"
            name="agreeTerms"
            required
          />
          <label for="agreeTerms" style="display: inline; margin: 0;">
            I agree to the <a href="#" style="color: var(--accent); text-decoration: none;">Terms of Service</a> and <a href="#" style="color: var(--accent); text-decoration: none;">Privacy Policy</a>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-register" id="submitBtn">
          Create Account
        </button>
      </form>

      <!-- Login Link -->
      <div class="login-link">
        Already have an account? <a href="./login">Sign In</a>
      </div>
    </div>
  </div>

  <!-- Neural Canvas Script -->
  <script>
    const canvas = document.getElementById("neuralCanvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.speedX = (Math.random() - 0.5) * 0.5;
        this.speedY = (Math.random() - 0.5) * 0.5;
        this.opacity = Math.random() * 0.5 + 0.25;
      }

      update() {
        this.x += this.speedX;
        this.y += this.speedY;

        if (this.x > canvas.width) this.x = 0;
        if (this.x < 0) this.x = canvas.width;
        if (this.y > canvas.height) this.y = 0;
        if (this.y < 0) this.y = canvas.height;
      }

      draw() {
        ctx.fillStyle = `rgba(124, 92, 252, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    const particles = [];
    for (let i = 0; i < 50; i++) {
      particles.push(new Particle());
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const particle of particles) {
        particle.update();
        particle.draw();
      }
      requestAnimationFrame(animate);
    }

    animate();

    window.addEventListener("resize", () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>

  <!-- Form Validation and Submission Script -->
  <script>
    const form = document.getElementById("registrationForm");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const errorDiv = document.getElementById("errorMessage");
    const successDiv = document.getElementById("successMessage");
    const submitBtn = document.getElementById("submitBtn");

    // Password strength validation
    function validatePasswordStrength(password) {
      const requirements = {
        length: password.length >= 8,
        uppercase: /[A-Z]/.test(password),
        lowercase: /[a-z]/.test(password),
        number: /[0-9]/.test(password),
        special: /[!@#$%^&*]/.test(password)
      };

      // Update UI
      document.getElementById("req-length").classList.toggle("met", requirements.length);
      document.getElementById("req-uppercase").classList.toggle("met", requirements.uppercase);
      document.getElementById("req-lowercase").classList.toggle("met", requirements.lowercase);
      document.getElementById("req-number").classList.toggle("met", requirements.number);
      document.getElementById("req-special").classList.toggle("met", requirements.special);

      return Object.values(requirements).every(r => r);
    }

    passwordInput.addEventListener("input", (e) => {
      validatePasswordStrength(e.target.value);
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorDiv.classList.remove("show");
      successDiv.classList.remove("show");

      // Get form data
      const firstName = document.getElementById("firstName").value.trim();
      const lastName = document.getElementById("lastName").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const company = document.getElementById("company").value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;
      const agreeTerms = document.getElementById("agreeTerms").checked;

      // Validation
      if (!firstName || !lastName || !email || !password || !confirmPassword) {
        showError("Please fill in all required fields.");
        return;
      }

      if (!validatePasswordStrength(password)) {
        showError("Password does not meet all requirements.");
        return;
      }

      if (password !== confirmPassword) {
        showError("Passwords do not match.");
        return;
      }

      if (!agreeTerms) {
        showError("You must agree to the Terms of Service and Privacy Policy.");
        return;
      }

      // Submit registration
      submitBtn.classList.add("loading");
      submitBtn.textContent = "Creating Account...";

      try {
        const response = await fetch("http://localhost:5000/api/auth/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            firstName,
            lastName,
            email,
            phone,
            company,
            password
          })
        });

        const data = await response.json();

        if (response.ok) {
          showSuccess("Account created successfully! Redirecting to login...");
          setTimeout(() => {
            window.location.href = "./login";
          }, 2000);
        } else {
          showError(data.message || "Registration failed. Please try again.");
        }
      } catch (err) {
        showError("Network error. Please check your connection and try again.");
        console.error("Registration error:", err);
      } finally {
        submitBtn.classList.remove("loading");
        submitBtn.textContent = "Create Account";
      }
    });

    function showError(message) {
      errorDiv.textContent = message;
      errorDiv.classList.add("show");
    }

    function showSuccess(message) {
      successDiv.textContent = message;
      successDiv.classList.add("show");
    }
  </script>
</body>
</html>
