<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Decision</title>
  <style>
    :root {
      --primary: #534AB7;
      --primary-dark: #3C3489;
      --primary-light: #EEEDFE;
      --bg: #F8F8FC;
      --card-bg: #FFFFFF;
      --text: #1A1A2E;
      --text-muted: #6C6C80;
      --border: #E4E4F0;
      --safe: #10B981;
      --safe-light: #E6F8F3;
      --caution: #F59E0B;
      --caution-light: #FEF3C7;
      --risk: #EF4444;
      --risk-light: #FEE2E2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #EAEAEF;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text);
    }

    /* Mobile Container Mock */
    .mobile-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 840px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
    }

    /* Header */
    header {
      background: var(--card-bg);
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
      flex-shrink: 0;
    }

    .back-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      margin-left: -8px;
      border-radius: 50%;
      transition: background 0.2s;
    }

    .back-btn:hover {
      background: var(--primary-light);
    }

    .back-btn svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: var(--text);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .header-title {
      font-size: 18px;
      font-weight: 700;
      margin-left: 12px;
      flex-grow: 1;
    }

    /* Content Area */
    .content {
      flex-grow: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding-bottom: 100px; /* space for bottom nav */
    }

    /* Loading State */
    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      gap: 16px;
      height: 100%;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--primary-light);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Warning Banner for HIGH RISK */
    .warning-banner {
      background: var(--risk-light);
      border: 1px solid #FECACA;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.05);
    }

    .warning-banner svg {
      width: 44px;
      height: 44px;
      stroke: var(--risk);
    }

    .warning-banner h3 {
      font-size: 18px;
      font-weight: 800;
      color: var(--risk);
    }

    .warning-banner p {
      font-size: 13.5px;
      color: #7F1D1D;
      line-height: 1.6;
    }

    /* Info Card */
    .decision-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.02);
    }

    .amount-display {
      font-size: 40px;
      font-weight: 850;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    .sender-info {
      font-size: 14px;
      color: var(--text-muted);
      text-align: center;
      background: var(--bg);
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      width: 100%;
      font-weight: 600;
      word-break: break-all;
    }

    /* Risk indicator inside decision */
    .risk-indicator-pill {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Button Area */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 10px;
      width: 100%;
    }

    .btn-action {
      width: 100%;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn-action:active {
      transform: scale(0.98);
    }

    .btn-accept {
      background: var(--safe);
      color: #FFFFFF;
    }

    .btn-accept:hover {
      opacity: 0.95;
    }

    .btn-decline {
      background: var(--risk);
      color: #FFFFFF;
    }

    .btn-decline:hover {
      opacity: 0.95;
    }

    .btn-return {
      background: var(--primary-light);
      color: var(--primary);
    }

    .btn-return:hover {
      background: #E0DDF9;
    }

    /* Bottom Navigation Bar */
    nav.bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 10px;
      font-weight: 600;
      width: 20%;
      height: 100%;
      gap: 4px;
      transition: color 0.2s;
    }

    .nav-item.active {
      color: var(--primary);
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s;
    }

    /* Utility Classes */
    .hide {
      display: none !important;
    }

    .bg-safe { background: var(--safe-light); color: var(--safe); }
    .bg-caution { background: var(--caution-light); color: var(--caution); }
    .bg-risk { background: var(--risk-light); color: var(--risk); }
  </style>
</head>
<body>

  <div class="mobile-container">
    <header>
      <button class="back-btn" onclick="goBack()">
        <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <div class="header-title">Payment Decision</div>
    </header>

    <!-- LOADING STATE -->
    <div id="loading" class="loading-state">
      <div class="spinner"></div>
      <div style="font-size: 15px; font-weight: 600; color: var(--text-muted);">Fetching Transaction Details...</div>
    </div>

    <!-- CONTENT SCREEN -->
    <div id="decision-content" class="content hide">
      
      <!-- HIGH RISK BANNER -->
      <div id="high-risk-alert" class="warning-banner hide">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <h3>High Risk Detected</h3>
        <p>This payment has been identified as HIGH RISK by PayGuard-Neural Inbound Protection. To protect your account, this inbound payment has been permanently blocked.</p>
      </div>

      <!-- SAFE/CAUTION TRANSACTION DETAILS -->
      <div id="txn-details-card" class="decision-card">
        <div id="risk-pill" class="risk-indicator-pill">SAFE</div>
        <div class="amount-display">₹<span id="txn-amount">0.00</span></div>
        <div class="sender-info">
          From: <span id="txn-sender">-</span>
        </div>
      </div>

      <!-- Button Groups -->
      <div class="button-group">
        <!-- Buttons shown for SAFE/CAUTION -->
        <button id="btn-accept" class="btn-action btn-accept" onclick="submitDecision('accept')">
          <svg style="width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          <span>Accept Payment</span>
        </button>
        <button id="btn-decline" class="btn-action btn-decline" onclick="submitDecision('decline')">
          <svg style="width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.5" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          <span>Decline Payment</span>
        </button>

        <!-- Return button shown for HIGH RISK or as fallback -->
        <button id="btn-return" class="btn-action btn-return hide" onclick="goBack()">
          <span>Return to Dashboard</span>
        </button>
      </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <a href="dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Home</span>
      </a>
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>History</span>
      </a>
      <a href="pay_gateway.html" class="nav-item active">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        <span>Pay / Scan</span>
      </a>
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>Risk Check</span>
      </a>
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Profile</span>
      </a>
    </nav>
  </div>

  <script>
    // Extract query parameters
    const urlParams = new URLSearchParams(window.location.search);
    const txnId = urlParams.get('id') || '';

    // Go back helper
    function goBack() {
      window.location.href = 'dashboard.html';
    }

    // Load transaction details on page load
    async function loadTransactionDetails() {
      if (!txnId) {
        alert("Missing transaction ID in URL parameters.");
        document.getElementById('loading').innerHTML = `
          <div style="font-size: 15px; font-weight: 600; color: var(--risk);">Error: No transaction provided</div>
        `;
        return;
      }

      try {
        const response = await fetch(`/api/transaction/${txnId}`);
        if (!response.ok) {
          throw new Error("Transaction not found");
        }

        const data = await response.json();
        renderTransaction(data);

      } catch (err) {
        console.error(err);
        document.getElementById('loading').innerHTML = `
          <div style="font-size: 15px; font-weight: 600; color: var(--risk);">Error loading transaction. Please try again.</div>
        `;
      }
    }

    function renderTransaction(data) {
      // Hide loader, show main content
      document.getElementById('loading').classList.add('hide');
      document.getElementById('decision-content').classList.remove('hide');

      const isHighRisk = data.risk_level === 'HIGH_RISK';

      if (isHighRisk) {
        // Show high risk alert and Return button
        document.getElementById('high-risk-alert').classList.remove('hide');
        document.getElementById('txn-details-card').classList.add('hide');
        document.getElementById('btn-accept').classList.add('hide');
        document.getElementById('btn-decline').classList.add('hide');
        document.getElementById('btn-return').classList.remove('hide');
      } else {
        // Render details for SAFE/CAUTION
        document.getElementById('txn-amount').textContent = parseFloat(data.amount).toFixed(2);
        document.getElementById('txn-sender').textContent = data.sender_upi;
        
        const pill = document.getElementById('risk-pill');
        pill.textContent = data.risk_level;
        pill.className = 'risk-indicator-pill'; // Reset classes
        
        if (data.risk_level === 'SAFE') {
          pill.classList.add('bg-safe');
        } else {
          pill.classList.add('bg-caution');
        }
      }
    }

    async function submitDecision(decision) {
      if (!txnId) return;

      // Show temporary loading indicator on the clicked button
      const btnAccept = document.getElementById('btn-accept');
      const btnDecline = document.getElementById('btn-decline');
      btnAccept.disabled = true;
      btnDecline.disabled = true;

      try {
        const response = await fetch(`/api/transaction/${txnId}/decide`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ decision: decision })
        });

        if (!response.ok) {
          throw new Error("Failed to process decision");
        }

        const data = await response.json();
        
        if (decision === 'accept') {
          window.location.href = `success.html?status=accepted&amount=${encodeURIComponent(data.transaction.amount)}&sender=${encodeURIComponent(data.transaction.sender_upi)}&receiver=${encodeURIComponent(data.transaction.receiver_upi)}`;
        } else {
          window.location.href = `declined.html?amount=${encodeURIComponent(data.transaction.amount)}&receiver=${encodeURIComponent(data.transaction.receiver_upi)}`;
        }

      } catch (err) {
        console.error(err);
        alert("Failed to submit decision. Please try again.");
        btnAccept.disabled = false;
        btnDecline.disabled = false;
      }
    }

    // Run on startup
    window.onload = loadTransactionDetails;
  </script>
</body>
</html>
