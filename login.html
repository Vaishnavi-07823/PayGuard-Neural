<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PayGuard Neural — Secure Login</title>
  <meta name="description" content="Log in to PayGuard Neural — AI-powered payment security for the modern world." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Base ─────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:    #06060f;
      --bg-card:    rgba(15, 14, 35, 0.55);
      --glass-border: rgba(120, 100, 255, 0.15);
      --accent:     #7c5cfc;
      --accent-glow:#9b7dff;
      --accent-2:   #00d4ff;
      --text-primary:   #eae8ff;
      --text-secondary: #9994c4;
      --text-muted:     #5e577e;
      --input-bg:   rgba(22, 20, 50, 0.7);
      --input-border: rgba(120, 100, 255, 0.2);
      --danger:     #ff5c7c;
      --success:    #00e89d;
      --radius-lg:  20px;
      --radius-md:  14px;
      --radius-sm:  10px;
    }

    html { font-size: 16px; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── Neural Particle Canvas ───────────────────── */
    #neuralCanvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Ambient Glow Orbs ────────────────────────── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.35;
      z-index: 0;
      animation: orbFloat 12s ease-in-out infinite alternate;
    }
    .orb--1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #7c5cfc 0%, transparent 70%);
      top: -10%; left: -8%;
      animation-duration: 14s;
    }
    .orb--2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #00d4ff 0%, transparent 70%);
      bottom: -12%; right: -6%;
      animation-duration: 10s;
      animation-delay: -4s;
    }
    .orb--3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, #c44dff 0%, transparent 70%);
      top: 50%; left: 60%;
      animation-duration: 16s;
      animation-delay: -8s;
    }
    @keyframes orbFloat {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(30px, -20px) scale(1.08); }
      100% { transform: translate(-20px, 25px) scale(0.95); }
    }

    /* ── Login Container ──────────────────────────── */
    .login-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 20px;
      animation: cardEnter 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(30px) scale(0.97);
    }
    @keyframes cardEnter {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-card {
      background: var(--bg-card);
      backdrop-filter: blur(40px) saturate(1.4);
      -webkit-backdrop-filter: blur(40px) saturate(1.4);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 44px 36px 36px;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 4px 60px rgba(124, 92, 252, 0.08),
        0 0 0 1px rgba(124, 92, 252, 0.06) inset;
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: -1px; left: -1px; right: -1px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), transparent);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }

    /* ── Logo & Branding ──────────────────────────── */
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 36px;
    }
    .brand__logo-wrap {
      width: 72px; height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(124,92,252,0.2), rgba(0,212,255,0.1));
      border: 1px solid rgba(124,92,252,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      position: relative;
      overflow: hidden;
      animation: logoPulse 4s ease-in-out infinite;
    }
    .brand__logo-wrap img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(124,92,252,0.4));
    }
    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 0 20px rgba(124,92,252,0.15); }
      50%      { box-shadow: 0 0 35px rgba(124,92,252,0.3); }
    }

    .brand__name {
      font-family: 'Outfit', sans-serif;
      font-size: 1.65rem;
      font-weight: 700;
      background: linear-gradient(135deg, #e0d8ff 0%, #9b7dff 50%, #00d4ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
    }
    .brand__tagline {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 4px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* ── Heading ───────────────────────────────────── */
    .login-heading {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-heading h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .login-heading p {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    /* ── Form ──────────────────────────────────────── */
    .form-group {
      margin-bottom: 18px;
      position: relative;
    }
    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 7px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .input-wrap {
      position: relative;
    }
    .input-wrap .icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px; height: 18px;
      color: var(--text-muted);
      transition: color 0.3s;
      pointer-events: none;
    }
    .input-wrap input {
      width: 100%;
      padding: 13px 14px 13px 44px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 0.92rem;
      outline: none;
      transition: all 0.3s ease;
    }
    .input-wrap input::placeholder {
      color: var(--text-muted);
    }
    .input-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124, 92, 252, 0.12), 0 0 20px rgba(124, 92, 252, 0.06);
      background: rgba(22, 20, 50, 0.9);
    }
    .input-wrap input:focus ~ .icon {
      color: var(--accent-glow);
    }
    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px;
      transition: color 0.3s;
    }
    .toggle-password:hover { color: var(--accent-glow); }
    .toggle-password svg { width: 18px; height: 18px; }

    /* ── Row: Remember / Forgot ────────────────────── */
    .form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .checkbox-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .checkbox-wrap input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 17px; height: 17px;
      border: 1.5px solid var(--input-border);
      border-radius: 5px;
      background: var(--input-bg);
      cursor: pointer;
      position: relative;
      transition: all 0.25s ease;
    }
    .checkbox-wrap input[type="checkbox"]:checked {
      background: var(--accent);
      border-color: var(--accent);
    }
    .checkbox-wrap input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 5px; top: 2px;
      width: 5px; height: 9px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }
    .checkbox-wrap span {
      font-size: 0.82rem;
      color: var(--text-secondary);
    }
    .forgot-link {
      font-size: 0.82rem;
      color: var(--accent-glow);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.25s;
    }
    .forgot-link:hover { color: var(--accent-2); }

    /* ── Login Button ─────────────────────────────── */
    .btn-login {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent) 0%, #6441e0 50%, var(--accent-2) 100%);
      background-size: 200% 200%;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      letter-spacing: 0.02em;
      animation: btnShimmer 4s ease-in-out infinite;
    }
    @keyframes btnShimmer {
      0%, 100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(124, 92, 252, 0.35);
    }
    .btn-login:active {
      transform: translateY(0);
      box-shadow: 0 2px 12px rgba(124, 92, 252, 0.2);
    }
    .btn-login .btn-ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      transform: scale(0);
      animation: ripple 0.6s ease-out;
      pointer-events: none;
    }
    @keyframes ripple {
      to { transform: scale(4); opacity: 0; }
    }

    /* ── Divider ───────────────────────────────────── */
    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 24px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--glass-border), transparent);
    }
    .divider span {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    /* ── Social Buttons ───────────────────────────── */
    .social-row {
      display: flex;
      gap: 12px;
    }
    .btn-social {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .btn-social svg { width: 18px; height: 18px; }
    .btn-social:hover {
      border-color: var(--accent);
      color: var(--text-primary);
      background: rgba(124, 92, 252, 0.08);
      transform: translateY(-1px);
    }

    /* ── Footer ────────────────────────────────────── */
    .login-footer {
      text-align: center;
      margin-top: 26px;
      font-size: 0.84rem;
      color: var(--text-secondary);
    }
    .login-footer a {
      color: var(--accent-glow);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.25s;
    }
    .login-footer a:hover { color: var(--accent-2); }

    /* ── Loading Spinner ──────────────────────────── */
    .spinner {
      display: none;
      width: 20px; height: 20px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ────────────────────────────────── */
    @media (max-width: 480px) {
      .login-card { padding: 32px 22px 28px; }
      .brand__name { font-size: 1.4rem; }
      .login-heading h1 { font-size: 1.15rem; }
    }
  </style>
</head>
<body>

  <!-- Ambient Glow Orbs -->
  <div class="orb orb--1"></div>
  <div class="orb orb--2"></div>
  <div class="orb orb--3"></div>

  <!-- Neural Network Particle Canvas -->
  <canvas id="neuralCanvas"></canvas>

  <!-- Login Card -->
  <div class="login-wrapper">
    <div class="login-card">

      <!-- Brand -->
      <div class="brand">
        <div class="brand__logo-wrap">
          <img src="logo.png" alt="PayGuard Neural Logo" />
        </div>
        <span class="brand__name">PayGuard Neural</span>
        <span class="brand__tagline">AI-Powered Payment Security</span>
      </div>

      <!-- Heading -->
      <div class="login-heading">
        <h1>Welcome Back</h1>
        <p>Sign in to your secure account</p>
      </div>

      <!-- Form -->
      <form id="loginForm" autocomplete="off">

        <!-- Email -->
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrap">
            <input type="email" id="email" placeholder="you@example.com" required />
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="3"/>
              <polyline points="22,5 12,13 2,5"/>
            </svg>
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" placeholder="Enter your password" required />
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="3"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              <circle cx="12" cy="16.5" r="1.5"/>
            </svg>
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember / Forgot -->
        <div class="form-row">
          <label class="checkbox-wrap">
            <input type="checkbox" id="remember" />
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-login" id="loginBtn">
          <span class="btn-text">Sign In</span>
          <div class="spinner" id="spinner"></div>
        </button>
      </form>

      <!-- Divider -->
      <div class="divider"><span>or continue with</span></div>

      <!-- Social -->
      <div class="social-row">
        <button class="btn-social" id="googleBtn">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Google
        </button>
        <button class="btn-social" id="appleBtn">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C3.79 16.17 4.36 9.33 8.73 9.07c1.27.07 2.16.72 2.91.76.97-.2 1.9-.77 2.93-.7 1.24.1 2.17.58 2.78 1.49-2.55 1.53-1.95 4.89.58 5.82-.46 1.2-.67 1.73-1.32 2.78-.72 1.15-1.74 2.58-3 2.6l-.56-.01.56.47zM12.05 9c-.16-2.04 1.53-3.8 3.44-3.97.26 2.28-2.06 3.99-3.44 3.97z"/>
          </svg>
          Apple
        </button>
      </div>

      <!-- Footer -->
      <div class="login-footer">
        Don't have an account? <a href="kyc.html" id="signupLink">Create one</a>
      </div>

    </div>
  </div>

  <script>
    /* ── Neural Network Background ─────────────────── */
    (() => {
      const canvas = document.getElementById('neuralCanvas');
      const ctx = canvas.getContext('2d');
      let w, h, particles = [], mouse = { x: null, y: null };
      const PARTICLE_COUNT = 80;
      const MAX_DIST = 140;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      class Particle {
        constructor() { this.reset(); }
        reset() {
          this.x = Math.random() * w;
          this.y = Math.random() * h;
          this.vx = (Math.random() - 0.5) * 0.5;
          this.vy = (Math.random() - 0.5) * 0.5;
          this.r = Math.random() * 2 + 1;
          this.hue = Math.random() > 0.5 ? 255 : 190;
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;
          if (this.x < 0 || this.x > w) this.vx *= -1;
          if (this.y < 0 || this.y > h) this.vy *= -1;
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
          ctx.fillStyle = this.hue === 255
            ? 'rgba(155, 125, 255, 0.6)'
            : 'rgba(0, 212, 255, 0.5)';
          ctx.fill();
        }
      }

      for (let i = 0; i < PARTICLE_COUNT; i++) particles.push(new Particle());

      window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
      window.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });

      function animate() {
        ctx.clearRect(0, 0, w, h);
        particles.forEach(p => { p.update(); p.draw(); });

        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < MAX_DIST) {
              const alpha = (1 - dist / MAX_DIST) * 0.15;
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(124, 92, 252, ${alpha})`;
              ctx.lineWidth = 0.6;
              ctx.stroke();
            }
          }
          /* Mouse attraction */
          if (mouse.x !== null) {
            const dx = particles[i].x - mouse.x;
            const dy = particles[i].y - mouse.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 200) {
              const alpha = (1 - dist / 200) * 0.25;
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(mouse.x, mouse.y);
              ctx.strokeStyle = `rgba(0, 212, 255, ${alpha})`;
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(animate);
      }
      animate();
    })();

    /* ── Toggle Password ───────────────────────────── */
    const toggleBtn = document.getElementById('togglePassword');
    const pwInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');
    let visible = false;

    toggleBtn.addEventListener('click', () => {
      visible = !visible;
      pwInput.type = visible ? 'text' : 'password';
      eyeIcon.innerHTML = visible
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    });

    /* ── Button Ripple ─────────────────────────────── */
    document.getElementById('loginBtn').addEventListener('click', function (e) {
      const rect = this.getBoundingClientRect();
      const ripple = document.createElement('span');
      ripple.className = 'btn-ripple';
      ripple.style.left = (e.clientX - rect.left) + 'px';
      ripple.style.top = (e.clientY - rect.top) + 'px';
      ripple.style.width = ripple.style.height = Math.max(rect.width, rect.height) + 'px';
      this.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    });

    /* ── Form Submit → Redirect to KYC ─────────────── */
    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const text = btn.querySelector('.btn-text');
      const spin = document.getElementById('spinner');

      text.style.display = 'none';
      spin.style.display = 'block';
      btn.disabled = true;
      btn.style.opacity = '0.8';

      setTimeout(() => {
        spin.style.display = 'none';
        text.textContent = '✓ Success';
        text.style.display = 'inline';
        btn.style.background = 'linear-gradient(135deg, #00e89d 0%, #00b87c 100%)';
        btn.style.opacity = '1';

        /* Redirect to KYC & Security page after brief success animation */
        setTimeout(() => {
          window.location.href = 'kyc.html';
        }, 1200);
      }, 1800);
    });
  </script>
</body>
</html>
