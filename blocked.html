<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Blocked</title>
  <style>
    :root {
      --primary: #534AB7;
      --primary-dark: #3C3489;
      --primary-light: #EEEDFE;
      --bg: #F8F8FC;
      --card-bg: #FFFFFF;
      --text: #1A1A2E;
      --text-muted: #6C6C80;
      --border: #E4E4F0;
      --safe: #10B981;
      --safe-light: #E6F8F3;
      --caution: #F59E0B;
      --caution-light: #FEF3C7;
      --risk: #EF4444;
      --risk-light: #FEE2E2;
      --risk-dark: #B91C1C;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #EAEAEF;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text);
    }

    .mobile-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 840px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.15);
    }

    header {
      background: var(--card-bg);
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      width: 100%;
      color: var(--risk);
    }

    .content {
      flex-grow: 1;
      overflow-y: auto;
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      padding-bottom: 100px;
    }

    /* Blocked Icon */
    .blocked-icon-wrapper {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: var(--risk-light);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid var(--risk);
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.18);
      position: relative;
    }

    .blocked-icon-wrapper svg {
      width: 48px;
      height: 48px;
      stroke: var(--risk);
    }

    /* Text Block */
    .blocked-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .blocked-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--risk);
    }

    .blocked-subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 280px;
      margin: 0 auto;
    }

    /* Receipt Card */
    .receipt-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      box-shadow: 0 4px 16px rgba(0,0,0,0.02);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .receipt-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13.5px;
      padding-bottom: 12px;
      border-bottom: 1px dashed var(--border);
    }

    .receipt-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .receipt-label {
      color: var(--text-muted);
      font-weight: 550;
    }

    .receipt-value {
      font-weight: 700;
      color: var(--text);
      word-break: break-all;
      max-width: 65%;
      text-align: right;
    }

    .receipt-value.amount {
      font-size: 22px;
      font-weight: 850;
      color: var(--risk);
    }

    /* Countdown Banner */
    .countdown-banner {
      background: var(--risk-light);
      border: 1.5px solid #FECACA;
      border-radius: 18px;
      padding: 18px 20px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.06);
    }

    .countdown-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--risk);
    }

    .countdown-timer {
      font-size: 34px;
      font-weight: 850;
      color: var(--risk-dark);
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .countdown-desc {
      font-size: 12.5px;
      color: #7F1D1D;
      text-align: center;
      line-height: 1.5;
    }

    /* Back Button */
    .btn-back {
      width: 100%;
      background: var(--primary);
      color: #FFFFFF;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-back:hover {
      background: var(--primary-dark);
    }

    .btn-back:active {
      transform: scale(0.98);
    }

    /* Bottom Navigation Bar */
    nav.bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 10px;
      font-weight: 600;
      width: 20%;
      height: 100%;
      gap: 4px;
      transition: color 0.2s;
    }

    .nav-item.active {
      color: var(--primary);
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>

  <div class="mobile-container">
    <header>
      <div class="header-title">High Risk (Auto Blocked)</div>
    </header>

    <div class="content">

      <!-- Blocked Shield Icon -->
      <div class="blocked-icon-wrapper">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>

      <!-- Title Block -->
      <div class="blocked-header">
        <h2 class="blocked-title">Payment Blocked</h2>
        <p class="blocked-subtitle">This payment is temporarily restricted due to a high risk score detected by PayGuard-Neural.</p>
      </div>

      <!-- Transaction Details Card -->
      <div class="receipt-card">
        <div class="receipt-row">
          <span class="receipt-label">Amount</span>
          <span id="receipt-amount" class="receipt-value amount">₹0.00</span>
        </div>
        <div class="receipt-row">
          <span class="receipt-label">Receiver</span>
          <span id="receipt-to" class="receipt-value">-</span>
        </div>
      </div>

      <!-- Countdown Banner -->
      <div class="countdown-banner">
        <div class="countdown-label">Try Again After</div>
        <div class="countdown-timer" id="countdown">02:00:00</div>
        <div class="countdown-desc">Payment is not possible right now.<br>Try again after 2 hours.</div>
      </div>

      <!-- Back Button -->
      <button class="btn-back" onclick="window.location.href='dashboard.html'">
        <svg style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2" viewBox="0 0 24 24">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Back to Home
      </button>

    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <a href="dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Home</span>
      </a>
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>History</span>
      </a>
      <a href="pay_gateway.html" class="nav-item active">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        <span>Pay / Scan</span>
      </a>
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>Risk Check</span>
      </a>
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Profile</span>
      </a>
    </nav>
  </div>

  <script>
    // Read URL params
    const urlParams = new URLSearchParams(window.location.search);
    const amount   = urlParams.get('amount')   || '0.00';
    const receiver = urlParams.get('receiver') || '-';

    document.getElementById('receipt-amount').textContent = '₹' + parseFloat(amount).toFixed(2);
    document.getElementById('receipt-to').textContent = receiver;

    // Live countdown — 2 hours from page load
    const TWO_HOURS_MS = 2 * 60 * 60 * 1000;
    const deadline = Date.now() + TWO_HOURS_MS;

    function pad(n) { return String(n).padStart(2, '0'); }

    function tick() {
      const remaining = Math.max(0, deadline - Date.now());
      const h = Math.floor(remaining / 3600000);
      const m = Math.floor((remaining % 3600000) / 60000);
      const s = Math.floor((remaining % 60000) / 1000);
      document.getElementById('countdown').textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
      if (remaining > 0) requestAnimationFrame(tick);
    }

    tick();
  </script>
</body>
</html>
